<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Midnight Crawl — Kokoro Voice Test</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.45}
    textarea{width:100%;box-sizing:border-box}
    .version{font-weight:700;padding:6px 10px;background:#eee;border-radius:6px;display:inline-block}
    #timer{font-size:1.15rem;font-weight:700;margin:10px 0}
    #diagnostics{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px;min-height:100px;font-family:ui-monospace,monospace;font-size:13px}
    button{padding:10px 14px;margin:10px 0}
  </style>
</head>
<body>
<main>
  <h1>Kokoro Voice Test</h1>
  <p class="version">Test version 0.2.2</p>
  <p>This test uses one very short sentence so we can measure Kokoro's actual speech-generation speed on this device.</p>
  <textarea id="text" rows="3">A door stands ahead.</textarea>
  <div>
    <label>Voice <select id="voice"></select></label>
    <label>Speed <input id="speed" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>
  </div>
  <button id="speak">Run short voice test</button>
  <p id="status">Page loaded. Waiting for Kokoro module…</p>
  <p id="timer">Generation time: —</p>
  <audio id="player" controls></audio>
  <h2>Diagnostics</h2>
  <div id="diagnostics">HTML loaded — v0.2.2</div>
</main>
<script type="module" src="./src.js?v=0.2.2"></script>
</body>
</html>
