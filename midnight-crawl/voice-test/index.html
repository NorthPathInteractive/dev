<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Midnight Crawl — Bundled Kokoro WebGPU Test</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.45}
    .version,.config{font-weight:700;padding:6px 10px;background:#eee;border-radius:6px;display:inline-block;margin-right:6px}
    #diagnostics{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px;min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
    button{padding:14px 18px;margin:12px 0;font-size:1rem}
    #status,#timer{font-weight:700}
    #timer{font-size:1.2rem}
  </style>
</head>
<body>
<main>
  <h1>Bundled Kokoro WebGPU Benchmark</h1>
  <p><span class="version">v0.6.0</span><span class="config">fp32 + WebGPU + Vite</span></p>
  <p>This build imports Kokoro as a real npm dependency and bundles it with Vite. It does not use jsDelivr's +esm conversion.</p>
  <p><strong>Test sentence:</strong> “A door stands ahead.”</p>
  <button id="run">Run bundled Kokoro test</button>
  <p id="status">Loading test…</p>
  <p id="timer">Time: —</p>
  <audio id="player" controls></audio>
  <h2>Diagnostics</h2>
  <div id="diagnostics">HTML loaded — v0.6.0</div>
</main>
<script type="module" src="/src.js"></script>
</body>
</html>
