<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DON'T MOVE</title><style>:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#050505;color:#eee;font-family:system-ui,-apple-system,sans-serif;height:100%}body{display:flex;justify-content:center}main{width:100%;max-width:700px;min-height:100dvh;display:flex;flex-direction:column;padding:18px}h1{font-size:1.4rem;letter-spacing:.12em;margin:.2rem 0}.sub{color:#999;margin:.25rem 0 1rem;line-height:1.35}#status{min-height:1.6rem;color:#ddd;margin:.3rem 0}.screen{flex:1;min-height:430px;border:1px solid #292929;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background:#090909}.zone{border:0;background:#090909;color:#4e4e4e;font-size:1rem;letter-spacing:.08em;touch-action:manipulation}.zone:active{background:#171717;color:#aaa}.zone:nth-child(1),.zone:nth-child(3){border-right:1px solid #191919}.zone:nth-child(1),.zone:nth-child(2){border-bottom:1px solid #191919}.controls{display:flex;gap:10px;margin-top:14px}.small{flex:1;min-height:50px;border-radius:14px;border:1px solid #333;background:#141414;color:#eee;font-weight:700}.hint{font-size:.82rem;color:#777;margin-top:10px}</style></head><body><main><h1>DON'T MOVE</h1><p class="sub">Headphones on. Tap Start, then close your eyes. Follow sounds left or right. Sometimes the correct move is no move at all.</p><div id="status">Ready.</div><section class="screen"><button class="zone" data-action="left">LEFT</button><button class="zone" data-action="right">RIGHT</button><button class="zone" data-action="down">DOWN</button><button class="zone" data-action="hold">HOLD / PANIC</button></section><div class="controls"><button class="small" id="start">Start</button><button class="small" id="replay">Replay cue</button><button class="small" id="restart">Restart</button></div><div class="hint">The first encounter teaches the interaction safely.</div></main><script>(()=>{const S=document.getElementById('status'),start=document.getElementById('start'),replay=document.getElementById('replay'),restart=document.getElementById('restart'),zones=[...document.querySelectorAll('.zone')];let ctx,master,current=null,running=false,accepting=false,i=0,lives=3,score=0,timer=null;const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};async function audio(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.65;master.connect(ctx.destination)}if(ctx.state==='suspended')await ctx.resume();return ctx}function panNode(v){if(!ctx.createStereoPanner)return null;const p=ctx.createStereoPanner();p.pan.value=v;return p}function tone(f=220,d=.2,g=.08,pan=0,delay=0,type='sine'){const o=ctx.createOscillator(),v=ctx.createGain(),p=panNode(pan),t=ctx.currentTime+delay;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.015);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);if(p){v.connect(p);p.connect(master)}else v.connect(master);o.start(t);o.stop(t+d+.04)}function noise(d=.15,g=.06,pan=0,delay=0){const len=Math.max(1,Math.floor(ctx.sampleRate*d)),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let n=0;n<len;n++)a[n]=(Math.random()*2-1)*(1-n/len);const s=ctx.createBufferSource(),v=ctx.createGain(),p=panNode(pan);s.buffer=b;v.gain.value=g;s.connect(v);if(p){v.connect(p);p.connect(master)}else v.connect(master);s.start(ctx.currentTime+delay)}function foot(side,delay=0){const p=side==='left'?-.9:.9;noise(.07,.08,p,delay);tone(60,.12,.075,p,delay)}function whisper(side){const p=side==='left'?-.97:.97;noise(.55,.025,p);tone(93,.45,.013,p,.05,'sawtooth')}function breath(){noise(.85,.035,0);tone(72,.72,.014,0,.05)}function beat(n=2){for(let x=0;x<n;x++){const d=x*.52;tone(58,.1,.08,0,d);tone(42,.12,.05,0,d+.12)}}function slam(){noise(.2,.15,0);tone(45,.3,.1,0,0,'sawtooth');vib([80,40,120])}function good(){tone(330,.12,.055,0);tone(440,.18,.05,0,.12);vib(30)}function bad(){slam();tone(90,.4,.08,0,.08,'sawtooth')}const scenes=[{answer:'left',window:5000,text:'Something is close. Follow the sound.',cue(){foot('left');setTimeout(()=>whisper('left'),400)}},{answer:'right',window:4200,text:'Listen.',cue(){foot('right');foot('right',.45);whisper('right')}},{answer:'silence',window:3500,text:'Listen carefully.',cue(){beat(2);setTimeout(breath,650)}},{answer:'left',window:3500,text:'It moved.',cue(){whisper('left');setTimeout(()=>foot('left'),600)}},{answer:'silence',window:3200,text:'Very close.',cue(){foot('right');foot('left',.32);setTimeout(breath,700)}},{answer:'hold',window:2700,text:'Now.',cue(){beat(3);setTimeout(slam,1000)}},{answer:'right',window:2900,text:"Don't trust the first sound.",cue(){whisper('left');setTimeout(()=>whisper('right'),520);setTimeout(()=>foot('right'),950)}}];function set(t){S.textContent=t}function cue(){current&&current.cue()}function next(){clearTimeout(timer);accepting=false;if(lives<=0){running=false;set(`You were found. Score ${score}. Tap Restart.`);bad();return}if(i>=scenes.length){running=false;set(`You survived. Score ${score}.`);tone(220,.2,.05);tone(330,.2,.05,0,.2);tone(440,.4,.06,0,.4);return}current=scenes[i++];set(current.text);setTimeout(()=>{cue();accepting=true;timer=setTimeout(()=>resolve(current.answer==='silence'?'silence':'miss'),current.window)},650)}function resolve(a){if(!accepting)return;accepting=false;clearTimeout(timer);if(a===current.answer){score++;good();set('Safe.')}else{lives--;bad();set(`Wrong. ${lives} chance${lives===1?'':'s'} left.`)}setTimeout(next,1000)}async function begin(){await audio();tone(240,.08,.07);set('Audio armed. Close your eyes.');if(running)return;running=true;i=0;lives=3;score=0;current=null;setTimeout(next,700)}start.addEventListener('click',begin);zones.forEach(z=>z.addEventListener('click',async()=>{await audio();if(running&&accepting)resolve(z.dataset.action)}));replay.addEventListener('click',async()=>{await audio();cue()});restart.addEventListener('click',async()=>{await audio();clearTimeout(timer);running=false;accepting=false;begin()});})();</script></body></html>
