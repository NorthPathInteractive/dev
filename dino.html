<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot Dino Builder — Draft</title>
<style>
:root{--bg:#10141c;--panel:#1c2430;--metal:#9aa6b2;--orange:#ff7a18;--red:#d93636;--blue:#56b7ff;--text:#f5f7fa}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#0b0f15,#18202b);color:var(--text);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px}h1{text-align:center;margin:5px 0;font-size:clamp(26px,6vw,44px)}.sub{text-align:center;color:#bac5cf;margin:0 0 14px}.stage{position:relative;min-height:380px;border:3px solid #354353;border-radius:22px;background:radial-gradient(circle at 50% 40%,#263445,#111821 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}.dino{position:relative;width:330px;height:230px;filter:drop-shadow(0 14px 12px #0008)}.body{position:absolute;left:100px;top:82px;width:150px;height:88px;background:linear-gradient(145deg,#c3ccd3,#606d78);border:5px solid #303a43;border-radius:45% 55% 42% 48%;box-shadow:inset 0 0 0 8px #89949d}.body:after{content:'⚙';position:absolute;left:57px;top:19px;font-size:35px;color:#29343d}.slot{position:absolute;display:flex;align-items:center;justify-content:center;color:#d9e0e6;font-size:12px;border:2px dashed #7f8d98;background:#202a34aa}.head{left:25px;top:65px;width:95px;height:70px;border-radius:45%}.tail{left:238px;top:98px;width:90px;height:36px;border-radius:50%}.legs{left:115px;top:164px;width:120px;height:62px;border-radius:16px}.wings{left:105px;top:15px;width:135px;height:55px;border-radius:50%}.equipped{border-style:solid;background:linear-gradient(145deg,#d14a32,#8d1d1d);color:white;font-weight:800;box-shadow:inset 0 0 0 5px #202832}.parts{margin-top:16px;background:var(--panel);padding:14px;border-radius:20px}.category{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.cat,.part{border:0;border-radius:14px;color:white;font-weight:800;cursor:pointer;touch-action:manipulation}.cat{padding:12px 16px;background:#354353;white-space:nowrap}.cat.active{background:var(--orange);color:#111}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.part{min-height:82px;background:#293542;border:2px solid #485869;padding:8px}.part span{display:block;font-size:28px}.part.selected{border-color:var(--blue);box-shadow:0 0 0 3px #56b7ff55}.ability{text-align:center;margin-top:12px;min-height:28px;color:#d8e6ef}.reset{display:block;margin:14px auto 0;background:#b62f2f;color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:800}@media(max-width:520px){.stage{min-height:330px}.dino{transform:scale(.88)}.choices{grid-template-columns:repeat(3,1fr)}.part{font-size:12px}}
</style></head>
<body><main class="wrap"><h1>ROBOT DINO BUILDER</h1><p class="sub">Pick robotic parts. Build your own dinosaur.</p><section class="stage"><div class="dino"><div class="body"></div><div class="slot head" id="slot-head">HEAD</div><div class="slot wings" id="slot-wings">WINGS</div><div class="slot tail" id="slot-tail">TAIL</div><div class="slot legs" id="slot-legs">LEGS</div></div></section><section class="parts"><div class="category" id="cats"></div><div class="choices" id="choices"></div><div class="ability" id="ability">Choose a part category.</div><button class="reset" id="reset">RESET DINO</button></section></main>
<script>
const data={
 head:[['Raptor Visor','🤖','Quick Scan'],['Horn Crusher','🦾','Power Smash'],['Sky Beak','🛩️','Air Scout']],
 wings:[['Rocket Wings','🚀','Turbo Flight'],['Shield Wings','🛡️','Air Defense'],['Climber Fins','⚙️','Rock Grip']],
 tail:[['Hammer Tail','🔨','Heavy Strike'],['Jet Tail','🔥','Speed Boost'],['Sensor Tail','📡','Treasure Scan']],
 legs:[['Climbing Claws','🦿','Climb Rocks'],['Sprint Legs','⚡','Fast Run'],['Tank Feet','⛓️','Heavy Armor']]
};
let category='head',picked={};const cats=document.querySelector('#cats'),choices=document.querySelector('#choices'),ability=document.querySelector('#ability');
function drawCats(){cats.innerHTML='';Object.keys(data).forEach(k=>{let b=document.createElement('button');b.className='cat '+(k===category?'active':'');b.textContent=k.toUpperCase();b.onclick=()=>{category=k;drawCats();drawChoices()};cats.appendChild(b)})}
function drawChoices(){choices.innerHTML='';data[category].forEach((p,i)=>{let b=document.createElement('button');b.className='part '+(picked[category]===i?'selected':'');b.innerHTML=`<span>${p[1]}</span>${p[0]}`;b.onclick=()=>equip(i);choices.appendChild(b)})}
function equip(i){picked[category]=i;let p=data[category][i],s=document.querySelector('#slot-'+category);s.className='slot '+category+' equipped';s.innerHTML=`${p[1]}<br>${p[0]}`;ability.textContent=`${p[0]} gives your dino: ${p[2]}!`;drawChoices()}
document.querySelector('#reset').onclick=()=>{picked={};Object.keys(data).forEach(k=>{let s=document.querySelector('#slot-'+k);s.className='slot '+k;s.textContent=k.toUpperCase()});ability.textContent='Dino reset — build something new!';drawChoices()};drawCats();drawChoices();
</script></body></html>
