<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audible RPG</title>
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#191b1f;--line:#353940;--text:#f4f1e8;--muted:#aaa69d;--accent:#d2b36c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(520px,100%)}h1{font-family:Georgia,serif;font-weight:500;letter-spacing:.04em;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 16px}.mapbox{background:#090a0b;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}.maphead{display:flex;justify-content:space-between;color:var(--accent);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.mapwrap{overflow:auto;display:flex;justify-content:center}.map{font:12px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre;color:#ddd8ca;margin:0}.legend{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}.scene{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:125px;display:flex;flex-direction:column;justify-content:center}.room{font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);margin-bottom:7px}.desc{line-height:1.45}.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,58px);gap:8px;justify-content:center;margin:18px 0}.pad button{font:inherit;font-size:23px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;touch-action:manipulation}.pad button:active{transform:scale(.96);background:#24272c}.n{grid-column:2}.w{grid-column:1;grid-row:2}.listen{grid-column:2;grid-row:2;font-size:11px!important;color:var(--accent)!important}.e{grid-column:3;grid-row:2}.s{grid-column:2;grid-row:3}.controls{display:flex;gap:10px;justify-content:center}.controls button{min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0 14px;font:inherit}.hint,.status{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
</style></head><body><main>
<h1>Audible RPG</h1><p class="sub">A headphones-first dungeon experiment.</p>
<section class="mapbox"><div class="maphead"><span>Dungeon Level 1</span><span id="coords"></span></div><div class="mapwrap"><pre class="map" id="map" aria-label="Dungeon automap"></pre></div><div class="legend">▲ ▶ ▼ ◀ you · + door · unexplored space is hidden</div></section>
<section class="scene" aria-live="polite"><div class="room" id="roomName"></div><div class="desc" id="description"></div></section>
<div class="pad" aria-label="Movement controls"><button class="n" data-dir="n" aria-label="North">▲</button><button class="w" data-dir="w" aria-label="West">◀</button><button class="listen" id="listen">LISTEN</button><button class="e" data-dir="e" aria-label="East">▶</button><button class="s" data-dir="s" aria-label="South">▼</button></div>
<div class="controls"><button id="repeat">Repeat narration</button></div><p class="status" id="status">Tap LISTEN to begin.</p><p class="hint">20×20 dungeon · Headphones recommended · Arrow keys/WASD · Gamepad D-pad</p>
<audio id="narrator" preload="auto"></audio>
</main><script>
const SIZE=20,VIEW=9;
const cells={
'10,17':{name:'The Threshold',text:'Cold air settles around you. Behind you is a heavy wooden door. A narrow stone passage continues north.',audio:'audio/room-threshold.mp3',edges:{n:'open',e:'wall',s:'door',w:'wall'}},
'10,16':{name:'Dripping Passage',text:'Water ticks steadily onto stone. The passage runs south to north. Somewhere to the east, you hear a faint draft.',audio:'audio/room-dripping-passage.mp3',edges:{n:'open',e:'open',s:'open',w:'wall'}},
'11,16':{name:'The Alcove',text:'You step into a shallow alcove. Your footsteps sound close here. The stone wall is inches from your hands. The passage lies west.',audio:'audio/room-alcove.mp3',edges:{n:'wall',e:'wall',s:'wall',w:'open'}},
'10,15':{name:'The Old Well',text:'The corridor opens into a round chamber. Your footsteps carry farther now. Water echoes from a deep well in the center. The passage back is south.',audio:'audio/room-old-well.mp3',edges:{n:'wall',e:'wall',s:'open',w:'wall'}}};
const delta={n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]},opposite={n:'s',e:'w',s:'n',w:'e'},arrows={n:'▲',e:'▶',s:'▼',w:'◀'},words={n:'north',e:'east',s:'south',w:'west'};
let x=10,y=17,facing='n',lastMove=0;const explored=new Set();
const narrator=document.querySelector('#narrator'),nameEl=document.querySelector('#roomName'),descEl=document.querySelector('#description'),statusEl=document.querySelector('#status'),mapEl=document.querySelector('#map'),coordsEl=document.querySelector('#coords');
const key=(a,b)=>`${a},${b}`;function room(){return cells[key(x,y)]}
function playRoom(){const r=room();if(!r)return;narrator.pause();narrator.currentTime=0;narrator.src=r.audio;narrator.play().then(()=>statusEl.textContent='Narrating: '+r.name).catch(()=>statusEl.textContent='Tap LISTEN to hear '+r.name+'.')}
function render(announce=true){explored.add(key(x,y));const r=room();nameEl.textContent=r?.name||'Unknown Passage';descEl.textContent=r?.text||'Cold stone surrounds you.';coordsEl.textContent=`${String(x+1).padStart(2,'0')},${String(SIZE-y).padStart(2,'0')}`;drawMap();if(announce)playRoom()}
function edgeAt(cx,cy,d){return cells[key(cx,cy)]?.edges?.[d]||'wall'}
function canMove(dir){const edge=edgeAt(x,y,dir);return edge==='open'||edge==='door'}
function move(dir){facing=dir;if(!canMove(dir)){statusEl.textContent=`A ${edgeAt(x,y,dir)==='door'?'door':'wall'} blocks the way ${words[dir]}.`;drawMap();return}const [dx,dy]=delta[dir],nx=x+dx,ny=y+dy;if(nx<0||nx>=SIZE||ny<0||ny>=SIZE||!cells[key(nx,ny)]){statusEl.textContent='The way is impassable.';drawMap();return}x=nx;y=ny;render(true)}
function drawMap(){const half=Math.floor(VIEW/2),minX=Math.max(0,Math.min(SIZE-VIEW,x-half)),minY=Math.max(0,Math.min(SIZE-VIEW,y-half));let out='';
for(let ry=minY;ry<minY+VIEW;ry++){
 let top='',mid='';
 for(let rx=minX;rx<minX+VIEW;rx++){const seen=explored.has(key(rx,ry)),r=cells[key(rx,ry)];if(!seen){top+='    ';mid+='    ';continue}const n=r?.edges?.n||'wall',w=r?.edges?.w||'wall';top+='+'+(n==='open'?'   ':n==='door'?'-+-':'---');mid+=(w==='open'?' ':w==='door'?'+':'|')+' '+(rx===x&&ry===y?arrows[facing]:'·')+' ';}
 const lastX=minX+VIEW-1;if(explored.has(key(lastX,ry)))mid+=(cells[key(lastX,ry)]?.edges?.e==='open'?' ':cells[key(lastX,ry)]?.edges?.e==='door'?'+':'|');out+=top+'+\n'+mid+'\n';}
 let bottom='';const by=minY+VIEW-1;for(let rx=minX;rx<minX+VIEW;rx++){if(!explored.has(key(rx,by))){bottom+='    ';continue}const s=cells[key(rx,by)]?.edges?.s||'wall';bottom+='+'+(s==='open'?'   ':s==='door'?'-+-':'---')}out+=bottom+'+';mapEl.textContent=out}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.dir)));document.querySelector('#listen').addEventListener('click',playRoom);document.querySelector('#repeat').addEventListener('click',playRoom);
window.addEventListener('keydown',e=>{const m={ArrowUp:'n',w:'n',W:'n',ArrowDown:'s',s:'s',S:'s',ArrowLeft:'w',a:'w',A:'w',ArrowRight:'e',d:'e',D:'e'};if(m[e.key]){e.preventDefault();move(m[e.key])}});
function pollGamepad(){const gp=navigator.getGamepads?.()[0];if(gp){const now=Date.now();let d=null;if(gp.buttons[12]?.pressed)d='n';else if(gp.buttons[13]?.pressed)d='s';else if(gp.buttons[14]?.pressed)d='w';else if(gp.buttons[15]?.pressed)d='e';if(d&&now-lastMove>400){move(d);lastMove=now}}requestAnimationFrame(pollGamepad)}requestAnimationFrame(pollGamepad);render(false);
</script></body></html>
