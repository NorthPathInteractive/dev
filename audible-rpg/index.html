<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Audible RPG</title>
<style>
:root{color-scheme:dark;--bg:#070808;--ink:#e7e0cc;--dim:#8f8a7e;--gold:#d2b36c;--line:#6d685d;--glass:rgba(7,8,8,.82)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}button{font:inherit}.game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#151511 0,#090a09 55%,#050606 100%)}.hud{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;color:var(--gold);font-size:11px;letter-spacing:.13em;text-transform:uppercase}.mapstage{position:absolute;inset:0;display:grid;place-items:center;padding:54px 8px 250px}.map{font:clamp(10px,3vw,15px)/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre;color:#cfc8b6;margin:0;filter:drop-shadow(0 0 8px rgba(210,179,108,.08));user-select:none}.scene{position:absolute;z-index:4;left:14px;right:14px;bottom:calc(170px + env(safe-area-inset-bottom));padding:12px 14px;background:linear-gradient(90deg,rgba(7,8,8,.92),rgba(16,17,16,.78),rgba(7,8,8,.92));border-top:1px solid rgba(210,179,108,.28);border-bottom:1px solid rgba(210,179,108,.18);text-align:center;backdrop-filter:blur(5px)}.room{font:600 11px system-ui,-apple-system,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}.desc{font:14px/1.35 Georgia,serif;color:#eee9dc;max-width:620px;margin:auto}.status{font:10px/1.2 system-ui,-apple-system,sans-serif;color:var(--dim);margin-top:5px;min-height:12px}.pad{position:absolute;z-index:6;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:220px;height:148px}.pad button{position:absolute;width:66px;height:52px;border:1px solid rgba(210,179,108,.38);background:rgba(12,13,12,.78);color:var(--ink);border-radius:10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(4px)}.pad button:active{background:rgba(210,179,108,.18);transform:scale(.96)}.pad .forward{left:77px;top:0}.pad .left{left:5px;top:55px}.pad .listen{left:77px;top:55px;color:var(--gold);font-size:10px}.pad .right{right:5px;top:55px}.pad .back{left:77px;top:110px;height:38px}.repeat{position:absolute;z-index:6;right:14px;bottom:max(16px,env(safe-area-inset-bottom));border:0;background:transparent;color:var(--dim);font-size:10px;padding:8px}.legend{position:absolute;z-index:3;left:12px;bottom:max(16px,env(safe-area-inset-bottom));color:#656158;font-size:9px}@media(max-height:650px){.mapstage{padding-bottom:210px}.scene{bottom:145px}.pad{transform:translateX(-50%) scale(.86);transform-origin:bottom center}.desc{font-size:12px}.legend,.repeat{display:none}}
</style></head><body><main class="game">
<div class="hud"><span>Dungeon Level 1</span><span id="coords"></span></div>
<div class="mapstage"><pre class="map" id="map" aria-label="Dungeon automap"></pre></div>
<section class="scene" aria-live="polite"><div class="room" id="roomName"></div><div class="desc" id="description"></div><div class="status" id="status">Tap LISTEN to begin.</div></section>
<div class="pad" aria-label="Movement controls"><button class="forward" data-action="forward" aria-label="Move forward">▲</button><button class="left" data-action="left" aria-label="Turn left">↶</button><button class="listen" id="listen">LISTEN</button><button class="right" data-action="right" aria-label="Turn right">↷</button><button class="back" data-action="back" aria-label="Move backward">▼</button></div>
<button class="repeat" id="repeat">REPEAT</button><div class="legend">▲ FORWARD · ↶ ↷ TURN · ▼ BACK</div><audio id="narrator" preload="auto"></audio>
</main><script>
const SIZE=20,VIEW=11;
const cells={
'10,17':{name:'The Threshold',text:'Cold air settles around you. Behind you is a heavy wooden door. A narrow stone passage continues north.',audio:'audio/room-threshold.mp3',edges:{n:'open',e:'wall',s:'door',w:'wall'}},
'10,16':{name:'Dripping Passage',text:'Water ticks steadily onto stone. The passage runs south to north. Somewhere to the east, you hear a faint draft.',audio:'audio/room-dripping-passage.mp3',edges:{n:'open',e:'open',s:'open',w:'wall'}},
'11,16':{name:'The Alcove',text:'You step into a shallow alcove. Your footsteps sound close here. The stone wall is inches from your hands. The passage lies west.',audio:'audio/room-alcove.mp3',edges:{n:'wall',e:'wall',s:'wall',w:'open'}},
'10,15':{name:'The Old Well',text:'The corridor opens into a round chamber. Your footsteps carry farther now. Water echoes from a deep well in the center. The passage back is south.',audio:'audio/room-old-well.mp3',edges:{n:'wall',e:'wall',s:'open',w:'wall'}}};
const delta={n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]},arrows={n:'▲',e:'▶',s:'▼',w:'◀'},words={n:'north',e:'east',s:'south',w:'west'},leftOf={n:'w',w:'s',s:'e',e:'n'},rightOf={n:'e',e:'s',s:'w',w:'n'},backOf={n:'s',s:'n',e:'w',w:'e'};
let x=10,y=17,facing='n',lastMove=0;const explored=new Set();const narrator=document.querySelector('#narrator'),nameEl=document.querySelector('#roomName'),descEl=document.querySelector('#description'),statusEl=document.querySelector('#status'),mapEl=document.querySelector('#map'),coordsEl=document.querySelector('#coords');
const key=(a,b)=>`${a},${b}`;function room(){return cells[key(x,y)]}function edgeAt(cx,cy,d){return cells[key(cx,cy)]?.edges?.[d]||'wall'}
function playRoom(){const r=room();if(!r)return;narrator.pause();narrator.currentTime=0;narrator.src=r.audio;narrator.play().then(()=>statusEl.textContent='Narrating · '+r.name).catch(()=>statusEl.textContent='Tap LISTEN to hear this location.')}
function render(announce=true){explored.add(key(x,y));const r=room();nameEl.textContent=r?.name||'Unknown Passage';descEl.textContent=r?.text||'Cold stone surrounds you.';coordsEl.textContent=`${String(x+1).padStart(2,'0')},${String(SIZE-y).padStart(2,'0')} · ${words[facing].toUpperCase()}`;drawMap();if(announce)playRoom()}
function step(dir){const edge=edgeAt(x,y,dir);if(edge!=='open'&&edge!=='door'){statusEl.textContent=`Wall · ${words[dir]}`;drawMap();return}const [dx,dy]=delta[dir],nx=x+dx,ny=y+dy;if(nx<0||nx>=SIZE||ny<0||ny>=SIZE||!cells[key(nx,ny)]){statusEl.textContent='The way is impassable.';drawMap();return}x=nx;y=ny;render(true)}
function act(action){if(action==='left'){facing=leftOf[facing];statusEl.textContent=`Facing ${words[facing]}.`;drawMap();coordsEl.textContent=`${String(x+1).padStart(2,'0')},${String(SIZE-y).padStart(2,'0')} · ${words[facing].toUpperCase()}`;return}if(action==='right'){facing=rightOf[facing];statusEl.textContent=`Facing ${words[facing]}.`;drawMap();coordsEl.textContent=`${String(x+1).padStart(2,'0')},${String(SIZE-y).padStart(2,'0')} · ${words[facing].toUpperCase()}`;return}step(action==='back'?backOf[facing]:facing)}
function drawMap(){const half=Math.floor(VIEW/2),minX=Math.max(0,Math.min(SIZE-VIEW,x-half)),minY=Math.max(0,Math.min(SIZE-VIEW,y-half));let out='';for(let ry=minY;ry<minY+VIEW;ry++){let top='',mid='';for(let rx=minX;rx<minX+VIEW;rx++){const seen=explored.has(key(rx,ry)),r=cells[key(rx,ry)];if(!seen){top+='    ';mid+='    ';continue}const n=r?.edges?.n||'wall',w=r?.edges?.w||'wall';top+='+'+(n==='open'?'   ':n==='door'?'-+-':'---');mid+=(w==='open'?' ':w==='door'?'+':'|')+' '+(rx===x&&ry===y?arrows[facing]:'·')+' '}const lx=minX+VIEW-1;if(explored.has(key(lx,ry)))mid+=(cells[key(lx,ry)]?.edges?.e==='open'?' ':cells[key(lx,ry)]?.edges?.e==='door'?'+':'|');out+=top+'+\n'+mid+'\n'}let bottom='',by=minY+VIEW-1;for(let rx=minX;rx<minX+VIEW;rx++){if(!explored.has(key(rx,by))){bottom+='    ';continue}const s=cells[key(rx,by)]?.edges?.s||'wall';bottom+='+'+(s==='open'?'   ':s==='door'?'-+-':'---')}mapEl.textContent=out+bottom+'+'}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));document.querySelector('#listen').addEventListener('click',playRoom);document.querySelector('#repeat').addEventListener('click',playRoom);window.addEventListener('keydown',e=>{const m={ArrowUp:'forward',w:'forward',W:'forward',ArrowDown:'back',s:'back',S:'back',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(m[e.key]){e.preventDefault();act(m[e.key])}});function pollGamepad(){const gp=navigator.getGamepads?.()[0];if(gp){const now=Date.now();let a=null;if(gp.buttons[12]?.pressed)a='forward';else if(gp.buttons[13]?.pressed)a='back';else if(gp.buttons[14]?.pressed)a='left';else if(gp.buttons[15]?.pressed)a='right';if(a&&now-lastMove>400){act(a);lastMove=now}}requestAnimationFrame(pollGamepad)}requestAnimationFrame(pollGamepad);render(false);
</script></body></html>
