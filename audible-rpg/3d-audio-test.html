<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audible RPG — Single SFX Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#050706;color:#eee6d1;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(92vw,420px);text-align:center}button{font:inherit;font-size:18px;padding:18px 28px;border:1px solid #d4b66c;background:#151710;color:#d4b66c;border-radius:12px;touch-action:manipulation}.small{color:#969184;font-size:14px;line-height:1.5}.status{min-height:24px;color:#d4b66c;margin:18px 0}</style></head><body><main class="wrap"><h2>Single Sound Test</h2><p class="small">One real sound effect. No narration. No ambience. No humming. No loop. No spatial processing yet.</p><button id="play">💧 PLAY WATER DROP</button><div class="status" id="status">Ready.</div><p class="small">Each tap plays the same single water-drop recording once.</p></main><script>
const button=document.querySelector('#play'),status=document.querySelector('#status');
const soundUrl='https://raw.githubusercontent.com/Lelio88/dewdrop/main/assets/audio/oneshot/water_drop.wav';
button.onclick=()=>{const a=new Audio(soundUrl);status.textContent='Playing one water drop…';a.play().catch(e=>status.textContent='Could not play effect: '+e.message);a.onended=()=>status.textContent='Ready.'};
</script></body></html>
