<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audible RPG — One Sound Spatial Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#050706;color:#eee6d1;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(94vw,440px);text-align:center}.map{position:relative;width:min(76vw,330px);aspect-ratio:1;margin:18px auto;border:1px solid #625f55;border-radius:50%;background:radial-gradient(circle,#151812,#070907 72%)}.you{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:40px;color:#d4b66c}.north{position:absolute;top:8%;left:50%;transform:translateX(-50%);color:#d4b66c;font-size:13px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{font:inherit;touch-action:manipulation;padding:13px 17px;border:1px solid #625f55;background:#11130f;color:#eee6d1;border-radius:9px}.play{border-color:#d4b66c;color:#d4b66c}.small{color:#969184;font-size:13px;line-height:1.45}.status{min-height:24px;color:#d4b66c;margin:12px 0}</style></head><body><main class="wrap"><h2>One-Sound Spatial Test</h2><p class="small">HEADPHONES ON. There is exactly ONE sound source, fixed NORTH of you.</p><button class="play" id="start">START AUDIO</button><div class="map"><div class="north">● ONE SOUND · NORTH</div><div class="you" id="you">▲</div></div><div class="controls"><button id="left">↶ TURN LEFT</button><button class="play" id="play">PLAY SOUND</button><button id="right">TURN RIGHT ↷</button></div><div class="status" id="status">Audio stopped.</div><p class="small">Play the same sound while facing NORTH, EAST, SOUTH and WEST. The source never moves; only your facing changes.</p></main><script>
let ctx,buffer,facing=0,ready=false;const status=document.querySelector('#status'),you=document.querySelector('#you'),dirs=['NORTH','EAST','SOUTH','WEST'],arrows=['▲','▶','▼','◀'];
function orient(){const a=facing*Math.PI/2,L=ctx.listener;L.forwardX.value=Math.sin(a);L.forwardY.value=0;L.forwardZ.value=-Math.cos(a);L.upX.value=0;L.upY.value=1;L.upZ.value=0;you.textContent=arrows[facing];status.textContent='Facing '+dirs[facing]+'. Tap PLAY SOUND.'}
async function start(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();const r=await fetch('audio/room-old-well.mp3?one-sound=1');if(!r.ok)throw new Error('sound failed to load');buffer=await ctx.decodeAudioData(await r.arrayBuffer());ctx.listener.positionX.value=0;ctx.listener.positionY.value=0;ctx.listener.positionZ.value=0}await ctx.resume();ready=true;orient();document.querySelector('#start').textContent='AUDIO READY'}
function play(){if(!ready){status.textContent='Tap START AUDIO first.';return}const src=ctx.createBufferSource(),p=ctx.createPanner();src.buffer=buffer;p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=1;p.maxDistance=20;p.rolloffFactor=.35;p.positionX.value=0;p.positionY.value=0;p.positionZ.value=-3;src.connect(p).connect(ctx.destination);src.start();status.textContent='ONE sound playing from NORTH · you face '+dirs[facing]}
function turn(n){if(!ready){status.textContent='Tap START AUDIO first.';return}facing=(facing+n+4)%4;orient()}
document.querySelector('#start').onclick=()=>start().catch(e=>status.textContent='Could not load sound: '+e.message);document.querySelector('#play').onclick=play;document.querySelector('#left').onclick=()=>turn(-1);document.querySelector('#right').onclick=()=>turn(1);
</script></body></html>
