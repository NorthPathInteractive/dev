<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Audible RPG — Water Drip 3D Test</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#050706;color:#eee6d1;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(94vw,440px);text-align:center}.map{position:relative;width:min(76vw,330px);aspect-ratio:1;margin:18px auto;border:1px solid #625f55;border-radius:50%;background:radial-gradient(circle,#151812,#070907 72%)}.you{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:40px;color:#d4b66c}.north{position:absolute;top:8%;left:50%;transform:translateX(-50%);color:#d4b66c;font-size:13px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{font:inherit;touch-action:manipulation;padding:13px 17px;border:1px solid #625f55;background:#11130f;color:#eee6d1;border-radius:9px}.start{border-color:#d4b66c;color:#d4b66c}.small{color:#969184;font-size:13px;line-height:1.45}.status{min-height:24px;color:#d4b66c;margin:12px 0}</style></head><body><main class="wrap"><h2>Water Drip — 3D Test</h2><p class="small">HEADPHONES ON. One water-drop recording repeats while its source stays fixed NORTH of you.</p><button class="start" id="start">💧 START DRIPPING</button><div class="map"><div class="north">💧 FIXED SOURCE · NORTH</div><div class="you" id="you">▲</div></div><div class="controls"><button id="left">↶ TURN LEFT</button><button id="right">TURN RIGHT ↷</button></div><div class="status" id="status">Stopped.</div><p class="small">Turn while the drops continue. The water source never moves; only your facing changes.</p></main><script>
let ctx,buffer,facing=0,running=false,timer=null;const status=document.querySelector('#status'),you=document.querySelector('#you'),startBtn=document.querySelector('#start'),dirs=['NORTH','EAST','SOUTH','WEST'],arrows=['▲','▶','▼','◀'];const soundUrl='https://raw.githubusercontent.com/Lelio88/dewdrop/main/assets/audio/oneshot/water_drop.wav';
function orient(){if(!ctx)return;const a=facing*Math.PI/2,L=ctx.listener;L.forwardX.value=Math.sin(a);L.forwardY.value=0;L.forwardZ.value=-Math.cos(a);L.upX.value=0;L.upY.value=1;L.upZ.value=0;you.textContent=arrows[facing];status.textContent=(running?'Dripping · ':'Stopped · ')+'facing '+dirs[facing];}
function drop(){if(!running||!ctx||!buffer)return;const src=ctx.createBufferSource(),p=ctx.createPanner();src.buffer=buffer;p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=1;p.maxDistance=20;p.rolloffFactor=.25;p.positionX.value=0;p.positionY.value=0;p.positionZ.value=-3;src.connect(p).connect(ctx.destination);src.start();}
function schedule(){if(!running)return;drop();timer=setTimeout(schedule,1200);}
async function start(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();const r=await fetch(soundUrl);if(!r.ok)throw new Error('water drop failed to load');buffer=await ctx.decodeAudioData(await r.arrayBuffer());ctx.listener.positionX.value=0;ctx.listener.positionY.value=0;ctx.listener.positionZ.value=0;}await ctx.resume();running=true;startBtn.textContent='■ STOP DRIPPING';orient();schedule();}
function stop(){running=false;if(timer){clearTimeout(timer);timer=null;}startBtn.textContent='💧 START DRIPPING';orient();}
startBtn.onclick=()=>{if(running){stop();return;}start().catch(e=>status.textContent='Could not start: '+e.message)};
function turn(n){facing=(facing+n+4)%4;you.textContent=arrows[facing];if(ctx)orient();else status.textContent='Facing '+dirs[facing]+' · start dripping when ready.';}
document.querySelector('#left').onclick=()=>turn(-1);document.querySelector('#right').onclick=()=>turn(1);
</script></body></html>
