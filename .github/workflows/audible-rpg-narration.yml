name: Audible RPG Narration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audible-rpg-narration
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate missing narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node audible-rpg/tools/generate-narration.mjs

      - name: Commit generated MP3 files
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No new audio files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audible-rpg/audio audible-rpg/narration.json
          git commit -m "Generate Audible RPG narration"
          git push
